name: Build and publish Chagi Web

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shared logic, mobile adapters and data regression checks
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Publish standalone WebAssembly
        run: dotnet publish Chagi.Web/Chagi.Web.csproj -c Release -o artifacts/site
      - name: Read Pages configuration
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Prepare repository-relative assets and direct links
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node scripts/prepare-pages.mjs artifacts/site/wwwroot "$PAGES_BASE_PATH"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: artifacts/site/wwwroot

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
